[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-local-server"
version = "0.1.0"
description = "Local-only native Strata server lifecycle with Windows memory protection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "psutil>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
strata-server = "strata_server.lifecycle:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
